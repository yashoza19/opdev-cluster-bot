apiVersion: v1
kind: ConfigMap
metadata:
  name: opdev-cluster-bot-config
  namespace: opdev-cluster-bot
  labels:
    app.kubernetes.io/name: opdev-cluster-bot
data:
  AWS_REGION: "us-east-1"
  BASE_DOMAIN: "dev.example.com"
  CREDS_NAMESPACE: "opdev-cluster-bot-creds"
  AWS_CREDS_SECRET: "aws-creds"
  PULL_SECRET_NAME: "pull-secret"
  SSH_SECRET_NAME: "ssh-privatekey"
  # Optional Slack channel ID for EOD reminders (leave empty to DM owners)
  REMINDER_CHANNEL: ""
  # Comma-separated Slack user group IDs for admin override
  ADMIN_SLACK_GROUP_IDS: ""
  DEFAULT_COMPUTE_REPLICAS: "3"
  SNO_MIN_INSTANCE_TYPE: "m5.2xlarge"
  MAX_CONCURRENT_PROVISIONS: "3"
  DRY_RUN: "false"
  MANAGED_BY_LABEL: "opdev-cluster-bot"
  TZ: "America/New_York"
