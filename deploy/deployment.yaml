apiVersion: apps/v1
kind: Deployment
metadata:
  name: opdev-cluster-bot
  namespace: opdev-cluster-bot
  labels:
    app.kubernetes.io/name: opdev-cluster-bot
    app.kubernetes.io/component: slack-bot
spec:
  # Socket Mode should run a single replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opdev-cluster-bot
      app.kubernetes.io/component: slack-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opdev-cluster-bot
        app.kubernetes.io/component: slack-bot
    spec:
      serviceAccountName: opdev-cluster-bot
      # Small hub: allow scheduling on control-plane when workers are full
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: bot
          image: quay.io/yoza/opdev-cluster-bot:latest
          imagePullPolicy: Always
          command: ["opdev-cluster-bot"]
          env:
            - name: TMPDIR
              value: /tmp
          envFrom:
            - configMapRef:
                name: opdev-cluster-bot-config
            - secretRef:
                name: opdev-cluster-bot-slack
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
